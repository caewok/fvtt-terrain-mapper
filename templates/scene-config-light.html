<fieldset>
<legend>{{localize "terrainmapper.scene-config.light.legend"}}</legend>
  <div class="form-group">
    <label>{{ localize "terrainmapper.scene-config.light.direction.name" }}</label>
    <div class="form-fields">
      <input type="number" name="flags.terrainmapper.lightDirection" class="terrainmapper" min="0" max="360" step="1" value="{{lightDirection}}">
    </div>
    <p class="hint">{{ localize "terrainmapper.scene-config.light.direction.hint" }}</p>
  </div>

  <div class="form-group">
    <label>{{ localize "terrainmapper.scene-config.light.elevation.name" }}</label>
    <div class="form-fields">
      <input type="number" name="flags.terrainmapper.lightElevation" class="terrainmapper" min="{{minElevation}}" max="{{maxElevation}}" step="1" value="{{lightElevation}}">
    </div>
    <p class="hint">{{ localize "terrainmapper.scene-config.light.elevation.hint" }}</p>
  </div>
</fieldset>
