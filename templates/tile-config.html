<fieldset>
  <legend>{{ localize "terrainmapper.name" }}</legend>

    <!-- Select tile shape -->
    <div class="form-group" id="terrainmapper-tile-config-tileAlphaShape">
      <label>{{ localize "terrainmapper.tile-config.tileAlphaShape.name" }} </label>
      <div class="form-fields">
        <select id="tileAlphaShape" name="flags.terrainmapper.tileAlphaShape" class="tokenvisibility">
          {{ selectOptions terrainmapper.tileAlphaShapeOptions selected=terrainmapper.selectedTileAlphaShape localize=true }}
        </select>
      </div>
      <p class="hint">{{ localize "terrainmapper.tile-config.tileAlphaShape.hint" }}</p>
    </div>

  </legend>
</fieldset>
