<fieldset>
  <legend>{{ localize "terrainmapper.name" }}</legend>

    <!-- Select tile shape -->
    <div class="form-group" id="terrainmapper-tile-config-tileAlphaShape">
      <label>{{ localize "terrainmapper.tile-config.tileAlphaShape.name" }} </label>
      <div class="form-fields">
        <select id="tileAlphaShape" name="flags.terrainmapper.tileAlphaShape" class="tokenvisibility">
          {{ selectOptions terrainmapper.tileAlphaShapeOptions selected=terrainmapper.selectedTileAlphaShape localize=true }}
        </select>
      </div>
      <p class="hint">{{ localize "terrainmapper.tile-config.tileAlphaShape.hint" }}</p>
    </div>

    <!-- Set Parallax -->
    <div class="form-group" id="terrainmapper-tile-config-parallax">
      <label>{{ localize "terrainmapper.tile-config.parallax.name" }} </label>
      <div class="form-fields">
        <range-picker id="terrainmapper-parallax" name="flags.terrainmapper.parallax" class="terrainmapper" placeholder="0" min="0" max = "0.5" step = "0.01" value="{{ document.flags.terrainmapper.parallax }}">
      </div>
      <p class="hint">{{ localize "terrainmapper.tile-config.parallax.hint" }}</p>
    </div>

  </legend>
</fieldset>
